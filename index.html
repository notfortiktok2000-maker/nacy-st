<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NACY ST - Creative Web Agency Morocco</title>
    <meta name="description" content="Creative agency offering web design, AI photo shooting and video production. Based in Tanger, Morocco." />
    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="theme-color" content="#ffffff">
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "NACY ST",
      "description": "Creative agency offering web design, AI photo shooting and video production. Based in Tanger, Morocco.",
      "url": "https://nacyst.com",
      "telephone": "+212710900502",
      "email": "eaagagency@gmail.cm",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Tanger",
        "addressCountry": "MA"
      },
      "priceRange": "350 MAD - 3499 MAD",
      "areaServed": "Worldwide",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "NACY ST Services",
        "itemListElement": [
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Website Creation" },
            "price": "3499",
            "priceCurrency": "MAD"
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "AI Photo Shooting" },
            "price": "950",
            "priceCurrency": "MAD"
          },
          {
            "@type": "Offer",
            "itemOffered": { "@type": "Service", "name": "Video Production" },
            "price": "350",
            "priceCurrency": "MAD"
          }
        ]
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
